name: Sendlane MCP Server (candidate)
description: >-
  Sendlane ships no Model Context Protocol server. This is a CANDIDATE tool list
  derived from the 82 operations in the published OpenAPI, showing what an MCP
  server over the Sendlane v2 API would expose. Nothing here is served by
  Sendlane and no endpoint below is callable.
status: candidate
deployment:
  mode: none
  endpoint: null
  install: null
  package: null
  auth: api-key
  verified: probed
search_evidence:
  - probe: https://mcp.sendlane.com/
    status: 302
    result: >-
      Resolves, but 302-redirects to https://auth.sendlane.com/login and then
      renders the Sendlane account login page. This is the app's wildcard host,
      NOT an MCP endpoint. A POST of {"jsonrpc":"2.0","id":1,"method":"tools/list"}
      to https://mcp.sendlane.com/mcp returns the same 302 to the login page.
      Recorded here explicitly so a later pass does not mistake the 200 for a server.
  - probe: https://registry.modelcontextprotocol.io/v0/servers?search=sendlane
    status: 200
    result: '{"servers":[],"metadata":{"count":0}} — no registered Sendlane server.'
  - probe: https://www.sendlane.com/.well-known/mcp.json
    status: 404
    result: absent
  - probe: https://github.com/sendlane
    status: 200
    result: >-
      11 public repos, no MCP server. Newest push across the org is 2025-06-10 and
      it is a fork of laravel-mongodb.
authentication:
  scheme: bearer-api-key
  header: Authorization
  format: 'Bearer <SENDLANE_API_TOKEN>'
  note: >-
    A server built from this list would take one account-scoped Sendlane v2 token as
    configuration. There are no scopes, so any tool exposed carries full account
    authority — including destructive deletes. Any implementation should gate the
    delete tools behind explicit opt-in.
