  /tracking/event:
    post:
      summary: Custom Event
      tags:
      - Custom Integration Webhooks
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomEventRequest.v2'
            examples:
              Example 1:
                value:
                  token: string
                  custom_event: string
                  email: string
                  data:
                    field1: value1
                    field2: value2
                    list1:
                    - item1
                    - item2
              Example 2:
                value:
                  token: string
                  custom_event: string
                  email: string
                  data:
                    password-reset-url: https://website.domain/forgotpassword
        description: The data component of the JSON body can be free form and can contain any data that you want to add for downstream use in automations
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/CustomIntegrationResponse.v2'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/CustomIntegrationErrorResponse.v2'
        '422':
          description: Invalid data
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/CustomIntegrationErrorResponse.v2'
      operationId: post-tracking-event
      description: Custom Event - This Call can be used to send an arbitrary payload to Sendlane to be used within automation sequences.  The data component of the payload is made available to emails and sms messages within automations that are setup as triggers for the custom-event.  Custom events can be created and given a name withing the Custom Integration.
components:
  schemas:
    TaxLine.v2:
      description: Tax Line Items
      type: object
      title: Tax Line
      x-examples:
        tax_line:
          name: California State Tax
          value: 1.01
      properties:
        name:
          type: string
        value:
          type: number
    AddedToCartRequest.v2:
      title: Added To Cart Request
      type: object
      x-examples:
        Cart Request:
          token: ABCDEFGHIJKLM1234567890
          cart_id: 123456789
          email: user@example.com
          phone: '+15555555555'
          checkout_url: https://www.example.com/checkout/123456789
          total_items: 1
          total: 19.99
          currency: USD
          line_items:
            product_id: 123456789
            variant_id: 123456789
            sku: ABC123
            product_name: string
            quantity: 1
            item_price: 19.99
            total: 19.99
          time: 1629825213
      properties:
        token:
          type: string
        cart_id:
          type: string
        email:
          type: string
        phone:
          type: string
        checkout_url:
          type: string
        total_items:
          type: integer
        total:
          type: number
        currency:
          type: string
        line_items:
          type: array
          items:
            $ref: '#/components/schemas/Product.v2'
        time:
          type: integer
          format: time-stamp
      required:
      - token
      - cart_id
