          type: string
        variant_id:
          type: string
        sku:
          type: string
        product_name:
          type: string
        quantity:
          type: integer
        item_price:
          type: number
        total:
          type: number
        compare_at_price:
          type: number
      required:
      - product_id
    ProductViewedRequest.v2:
