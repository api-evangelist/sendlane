components:
  schemas: {}
  securitySchemes:
    BearerToken:
      name: Authorization
      type: apiKey
      in: header
      description: 'API token sent in the Authorization header with the value "Bearer {apiToken}"'
    OtherAccountBearerToken:
      name: Authorization-Destination
      type: apiKey
      in: header
      description: 'API token for other account sent in the Authorization-Destination header with the value "Bearer {apiToken}"'
  responses:
    error-response:
      description: Difference in response is that validation errors are keyed on the attribute that failed validation. All other errors will have the errors object as an array of errors
      content:
        application/json:
          schema:
            $ref: ./responses/ErrorResponse.v2.yaml
          examples:
            Validation Error:
              value:
                message: The given data was invalid.
                errors:
                  failedAttribute:
                    - error message
            Standard Error:
              value:
                message: string
                errors:
                  - An error occurred
  parameters:
    limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        default: 100
      description: Maximum number of results per request
    page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        default: '1'
      description: Page of results to return
    from:
      schema:
        type: string
        format: date-time
      name: from
      description: Starting datetime. Required if the "to" parameter is in the query.
      in: query
      required: false
      example: '`2024-12-04T12:30:40-05:00` or `2024-12-04T12:30:40%2b05:00` or `2024-12-04T12:00:00%2b00:00` or `2024-12-04T12:00:00Z`'
    to:
      schema:
        type: string
        format: date-time
      name: to
      description: Ending datetime.
      in: query
      required: false
      example: '`2024-12-04T12:30:40-05:00` or `2024-12-04T12:30:40%2b05:00` or `2024-12-04T12:00:00%2b00:00` or `2024-12-04T12:00:00Z`'
