      operationId: post-tracking-event
      description: Custom Event - This Call can be used to send an arbitrary payload to Sendlane to be used within automation sequences.  The data component of the payload is made available to emails and sms messages within automations that are setup as triggers for the custom-event.  Custom events can be created and given a name withing the Custom Integration.
  /integrations/custom:
    get:
      summary: List Integrations
      operationId: list-custom-integrations
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IndexCustomIntegrationsResponse.v2'
      description: Get integrations
      tags:
        - Custom Integrations
    post:
      summary: Create Integration
      operationId: create-custom-integration
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCustomIntegrationRequest.v2'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateIntegrationResponse.v2'
        '422':
          description: Invalid data
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/ErrorResponse.v2'
      description: Create a custom integration
      tags:
        - Custom Integrations
  '/integrations/custom/{integrationToken}':
    delete:
      summary: Delete Integration
      operationId: delete-custom-integration
      parameters:
        - schema:
            type: string
            format: uuid
          name: integrationToken
          in: path
          required: true
      responses:
        '204':
          description: No Content
      description: Delete a custom integration
      tags:
        - Custom Integrations
  '/integrations/custom/{integrationToken}/events':
    get:
      summary: List Events
      operationId: index-custom-events
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IndexCustomEventsResponse.v2'
      description: List custom events related to an custom integration
      tags:
