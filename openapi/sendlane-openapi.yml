        '422':
          description: Invalid data
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/ErrorResponse.v2'
      description: Create a custom integration event
      tags:
        - Custom Integration Events
  '/integrations/custom/{integrationToken}/events/{eventId}':
