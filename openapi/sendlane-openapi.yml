openapi: 3.0.0
info:
  title: Api Reference
  version: '2.0'
  contact:
    name: Sendlane
    url: 'https://sendlane.com'
    email: support@sendlane.com
  description: Sendlane V2 API
servers:
  - url: 'https://api.sendlane.com/v2'
    description: Sendlane
paths:
  '/lists/{listId}/contacts':
    parameters:
      - schema:
          type: integer
        name: listId
        in: path
        required: true
      - $ref: '#/components/parameters/from'
      - $ref: '#/components/parameters/to'
    post:
      summary: Create List Contact
      operationId: post-lists-listId-contacts
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/AcceptedResponse.v2'
      description: 'Add a contact to a list (In order to add **SMS Consent** to the request, the **Contact SMS Consent** endpoint must first be enabled in your account by contacting support)'
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              description: ''
              type: object
              properties:
                contacts:
                  type: array
                  uniqueItems: true
                  minItems: 1
                  items:
                    $ref: '#/components/schemas/ListContact.v2'
              required:
                - contacts
            examples:
              Add Contact:
                value:
                  contacts:
                    - email: user@example.com
                      first_name: string
                      last_name: string
                      phone: '+15555555555'
                      email_consent: true
                      sms_consent: []
                      tag_ids:
                        - 1
                      tagNames:
                        - tag
                      custom_fields: []
              Add Multiple Contacts:
                value:
                  contacts:
                    - email: user@example.com
                      first_name: string
                      last_name: string
                      phone: '+15555555555'
                      email_consent: true
                      sms_consent: []
                      tag_ids:
                        - 1
                      custom_fields:
                        - key: birthday
                          value: '2022-12-12'
                        - key: alias
                          value: J.Doe
        description: array of contact objects
      tags:
        - List Contacts
    get:
      summary: Get List Contacts
      operationId: get-lists-listId-contacts
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactIndexResponse.v2'
      description: Get contacts from list
      tags:
        - List Contacts
  '/lists/{listId}/contacts/{contactId}':
    parameters:
      - schema:
          type: integer
        name: contactId
        in: path
        required: true
    get:
      summary: Get List Contact
      description: Get List Contact
      tags:
        - List Contacts
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactResponse.v2'
      operationId: get-lists-listId-contacts-contactId
      parameters: []
    delete:
      description: Delete Contact from List
      summary: Delete Contact from List
      operationId: delete-lists-listId-contacts-contactId
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/AcceptedResponse.v2'
      tags:
        - List Contacts
  /lists:
    get:
      summary: Get lists
      tags:
        - Lists
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/List.v2'
                  links:
                    $ref: '#/components/schemas/PaginatorLinks.v2'
                  meta:
                    $ref: '#/components/schemas/PaginatorMeta.v2'
              examples:
                Lists:
                  value:
                    data:
                      - id: 1
                        list_name: string
                        default_from_name: string
                        default_from_email: string
                        default_reply_email: string
                        default_subject: string
                        list_key: string
                        description: string
                        created_by: string
                        contact_name: string
                        contact_email: string
                        company: string
                        address: string
                        city: string
                        postal_code: string
                        country: string
                        state_code: string
                        phone: string
                        status: string
                        date_added: string
                        deleted_date: null
      operationId: get-lists
      description: Returns the lists for the authenticated user
      parameters:
        - schema:
            type: integer
            format: int64
            default: 10
          in: query
          name: limit
          description: Maximum number of results
        - schema:
            type: integer
            default: 1
          in: query
          name: page
          description: Page of results to return
    post:
      summary: Create List
      operationId: post-lists
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListResponse.v2'
              examples:
                Store List Response:
                  value:
                    data:
                      id: 1
                      name: string
                      description: string
                      status: string
                      created: string
                      flagged: string
      description: Create a list
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StoreListRequest.v2'
            examples:
              Create list:
                value:
                  id: 1
                  list_name: string
                  default_from_name: string
                  default_from_email: string
                  default_reply_email: string
                  default_subject: string
                  list_key: string
                  description: string
                  created_by: string
                  contact_name: string
                  contact_email: string
                  company: string
                  address: string
                  city: string
                  postal_code: string
                  country: string
                  state_code: string
                  phone: string
                  status: string
                  date_added: string
      tags:
        - Lists
  '/lists/{listId}':
