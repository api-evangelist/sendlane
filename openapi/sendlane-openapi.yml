                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Sender.v2'
                  links:
                    type: object
                    required:
                      - first
                      - last
                    properties:
                      first:
                        type: string
                        minLength: 1
                      last:
                        type: string
                        minLength: 1
                      prev:
                        type: string
                        nullable: true
                      next:
                        type: string
                        nullable: true
                  meta:
                    type: object
                    required:
                      - current_page
                      - last_page
                      - path
                      - per_page
                      - total
                    properties:
                      current_page:
                        type: integer
                      from: {}
                      last_page:
                        type: integer
                      path:
                        type: string
                        minLength: 1
                      per_page:
                        type: integer
                      to: {}
                      total:
                        type: integer
                required:
                  - data
                  - links
                  - meta
              examples: {}
      operationId: get-senders
